[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pds-registration-harness"
version = "0.3.0"
description = "A safety-first local harness for PDS registration-test planning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
documents = [
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "pywin32>=308; platform_system == 'Windows'",
]
browser = ["playwright>=1.50,<2"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.10,<1"]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.22"]

[project.scripts]
pds-harness = "pds_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

